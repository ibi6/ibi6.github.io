<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Hang · 独立开发者 · 开源与工具" />
  <title>Hang · 独立开发者</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('ibi6-theme');
        if (!t) t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="./vendor/ui-kit.css" />
  <style>
    :root {
      --primary: var(--uic-primary);
      --primary-light: #8a72ff;
      --primary-dark: var(--uic-primary-dark);
      --accent: var(--uic-accent);
      --marker: color-mix(in srgb, var(--uic-primary) 22%, transparent);
      --bg: var(--uic-panel);
      --bg-soft: var(--uic-bg);
      --bg-footer: var(--uic-bg);
      --fg: var(--uic-ink);
      --fg-light: var(--uic-mute);
      --fg-faint: var(--uic-muted);
      --border: var(--uic-line);
      --border-soft: color-mix(in srgb, var(--uic-line) 70%, transparent);
      --shadow: var(--uic-shadow);
      --shadow-hover: 0 10px 28px -12px rgba(108,77,255,.28);
      --radius: var(--uic-radius);
      --header-h: 52px;
      --tabs-h: 42px;
      --sidebar-w: 220px;
      --content-max: 920px;
      --font: "Inter", "Avenir Next", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--fg);
      background: var(--bg);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      transition: background .35s, color .35s;
    }
    a { color: var(--primary); text-decoration: none; }
    a:hover { text-decoration: underline; }
    img { max-width: 100%; display: block; }

    .site-header {
      position: sticky; top: 0; z-index: 100;
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: saturate(180%) blur(12px);
      -webkit-backdrop-filter: saturate(180%) blur(12px);
      border-bottom: 1px solid var(--border-soft);
    }
    .header-inner {
      max-width: 1280px; margin: 0 auto;
      height: var(--header-h);
      padding: 0 1.25rem;
      display: flex; align-items: center; gap: .85rem;
    }
    .brand {
      display: inline-flex; align-items: center; gap: .55rem;
      color: var(--fg); text-decoration: none !important;
      font-weight: 300; letter-spacing: .1em; font-size: .95rem;
      flex-shrink: 0;
    }
    .brand-mark {
      width: 28px; height: 28px; border-radius: 10px;
      background: linear-gradient(135deg, var(--uic-primary), var(--uic-accent));
      color: #fff; display: grid; place-items: center;
      font-weight: 700; font-size: .8rem; letter-spacing: 0;
    }
    .header-spacer { flex: 1; min-width: .5rem; }
    .search-chip {
      display: inline-flex; align-items: center; gap: .45rem;
      height: 34px; padding: 0 .7rem 0 .65rem;
      border: 1px solid var(--border); border-radius: 999px;
      background: var(--bg-soft); color: var(--fg-faint);
      font-size: .8rem; cursor: pointer; user-select: none;
      transition: border-color .2s, color .2s, background .2s;
      flex-shrink: 1; min-width: 0;
    }
    .search-chip:hover, .search-chip:focus-visible {
      border-color: var(--primary); color: var(--fg-light);
      outline: none; background: var(--bg);
    }
    .search-chip svg { width: 15px; height: 15px; flex-shrink: 0; }
    .search-chip .hint {
      font-family: var(--mono); font-size: .68rem;
      padding: .1rem .35rem; border-radius: 5px;
      border: 1px solid var(--border); color: var(--fg-faint);
      background: var(--bg);
    }
    .header-actions { display: flex; align-items: center; gap: .55rem; flex-shrink: 0; }
    .theme-wrap { display: inline-flex; align-items: center; gap: .4rem; }
    .theme-wrap .lbl { font-size: .72rem; color: var(--fg-faint); letter-spacing: .02em; }
    .icon-btn {
      width: 36px; height: 36px; border: 1px solid transparent; border-radius: 10px;
      background: transparent; color: var(--fg-light); cursor: pointer;
      display: grid; place-items: center;
    }
    .icon-btn:hover { background: var(--bg-soft); color: var(--fg); border-color: var(--border); }
    .icon-btn svg { width: 20px; height: 20px; }
    .gh-source {
      display: inline-flex; align-items: center; gap: .45rem;
      padding: .35rem .6rem; border-radius: 999px;
      color: var(--fg) !important; text-decoration: none !important;
      font-size: .8rem; border: 1px solid var(--border);
      background: var(--bg-soft);
    }
    .gh-source:hover { border-color: var(--primary); color: var(--primary) !important; }
    .gh-source svg { width: 16px; height: 16px; fill: currentColor; }
    .menu-toggle { display: none; }

    .tabs-bar {
      position: sticky; top: var(--header-h); z-index: 99;
      border-bottom: 1px solid var(--border-soft);
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .tabs-inner {
      max-width: 1280px; margin: 0 auto;
      padding: 0 1.25rem;
      height: var(--tabs-h);
      display: flex; align-items: stretch; gap: .15rem;
      overflow-x: auto; scrollbar-width: none;
    }
    .tabs-inner::-webkit-scrollbar { display: none; }
    .tabs-inner a {
      display: inline-flex; align-items: center;
      padding: 0 .85rem; color: var(--fg-light);
      font-size: .86rem; font-weight: 500;
      text-decoration: none !important;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: color .15s, border-color .15s;
    }
    .tabs-inner a:hover { color: var(--fg); }
    .tabs-inner a.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      font-weight: 600;
    }

    .shell {
      max-width: 1280px; margin: 0 auto;
      display: grid;
      grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
      min-height: calc(100vh - var(--header-h) - var(--tabs-h));
    }
    .sidebar {
      position: sticky;
      top: calc(var(--header-h) + var(--tabs-h));
      align-self: start;
      height: calc(100vh - var(--header-h) - var(--tabs-h));
      overflow: auto;
      padding: 1.25rem 0.75rem 2rem 1.25rem;
      border-right: 1px solid var(--border-soft);
      font-size: .86rem;
      background: var(--bg);
    }
    .sidebar h4 {
      margin: 1rem 0 .4rem; font-size: .72rem; font-weight: 700;
      letter-spacing: .06em; text-transform: uppercase; color: var(--fg-faint);
    }
    .sidebar h4:first-child { margin-top: 0; }
    .sidebar a {
      display: block; padding: .35rem .6rem; border-radius: 8px;
      color: var(--fg-light); text-decoration: none !important;
    }
    .sidebar a:hover, .sidebar a.active {
      background: var(--uic-hover);
      color: var(--primary);
    }

    .main { padding: 1.25rem 1.5rem 3rem; background: var(--bg); }
    .home { max-width: var(--content-max); margin: 0 auto; }

    .hero-wrapper {
      display: flex; align-items: center; justify-content: space-between;
      gap: 1.75rem;
      padding: 2.2rem 2.4rem;
      margin: .35rem 0 1rem;
      border-radius: 22px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      background-image: radial-gradient(var(--border) 1.15px, transparent 1.15px);
      background-size: 18px 18px;
      background-color: var(--bg);
    }
    .hero-content { flex: 1; min-width: 0; }
    .hero-title {
      font-size: 2.1rem; font-weight: 800; margin: 0;
      line-height: 1.3; color: var(--fg);
      letter-spacing: -.02em;
    }
    .marker {
      background: linear-gradient(to bottom, transparent 58%, var(--marker) 0%);
      padding: 0 6px; border-radius: 4px; color: var(--primary);
      font-weight: 800;
    }
    .hero-intro {
      font-size: 1.5rem; font-weight: 500; margin: .55rem 0 .85rem;
      color: var(--fg-light); line-height: 1.35;
    }
    .typewriter-row {
      min-height: 1.75rem; margin: .55rem 0 .9rem;
      display: flex; align-items: center;
      font-family: var(--mono); font-size: 1.12rem; font-weight: 700;
      color: var(--fg-light); letter-spacing: -.01em;
    }
    .cursor {
      display: inline-block; width: 2.5px; height: 1.2rem;
      margin-left: 4px; background: var(--primary); border-radius: 1px;
      animation: blink .85s step-end infinite;
      vertical-align: -2px;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .hero-motto {
      margin: 0 0 1rem; color: var(--fg-light); font-size: .95rem;
      max-width: 34rem;
    }
    .hero-btns { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: .15rem; }
    .avatar-glow {
      width: 11rem; height: 11rem; border-radius: 50%;
      padding: 3px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--uic-primary) 0%, var(--uic-accent) 100%);
      box-shadow: 0 12px 32px -10px rgba(108, 77, 255, .45);
    }
    .avatar-glow img, .avatar-inner {
      width: 100%; height: 100%; border-radius: 50%;
      object-fit: cover; background: var(--bg);
      display: block;
    }
    .avatar-inner {
      display: grid; place-items: center;
      font-size: 3.2rem; font-weight: 700; color: var(--primary);
    }

    .grid-container {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 12px; margin: 1.1rem 0 1.4rem;
    }
    .grid-card {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 16px; padding: 1rem 1.05rem;
      display: flex; flex-direction: column; gap: .4rem;
      transition: border-color .2s, box-shadow .2s, transform .2s;
      text-decoration: none !important; color: inherit;
      box-shadow: 0 1px 0 rgba(255,255,255,.4) inset;
    }
    .grid-card:hover {
      border-color: var(--primary);
      box-shadow: var(--shadow-hover);
      transform: translateY(-3px);
      text-decoration: none !important;
    }
    .grid-card h3 {
      margin: 0; font-size: 1rem; font-weight: 700;
      display: flex; align-items: center; gap: .45rem; color: var(--fg);
    }
    .grid-card h3 .ico { font-size: 1.05rem; line-height: 1; }
    .grid-card p {
      margin: 0; font-size: .82rem; line-height: 1.55; color: var(--fg-light);
      flex: 1;
    }
    .tag-box {
      display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .4rem;
      align-items: center; font-size: .72rem;
    }
    .tag-link {
      display: inline-flex; align-items: center; gap: 2px;
      color: var(--primary) !important; font-weight: 700;
      text-decoration: none !important;
    }
    .tag-link .jump {
      width: 13px; height: 13px; fill: currentColor;
      transition: transform .3s cubic-bezier(.34,1.56,.64,1);
    }
    .tag-link:hover .jump { transform: translate(3px,-3px); }
    .tag-hash { color: var(--fg-light); opacity: .85; font-weight: 400; }
    .tag-hash::before { content: "#"; opacity: .55; font-family: var(--mono); margin-right: 1px; }

    .section { margin: 2.4rem 0 0; scroll-margin-top: calc(var(--header-h) + var(--tabs-h) + 12px); }
    #top, #categories { scroll-margin-top: calc(var(--header-h) + var(--tabs-h) + 12px); }
    .section-head {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 1rem; margin-bottom: .75rem; flex-wrap: wrap;
    }
    .section-head h2 { margin: 0; font-size: 1.25rem; font-weight: 700; color: var(--fg); }
    .section-desc { margin: 0 0 .9rem; color: var(--fg-light); font-size: .92rem; }
    .rec-title {
      margin: 2.2rem 0 1.1rem; font-weight: 700; color: var(--fg);
      display: flex; align-items: center; justify-content: center; gap: 14px;
      font-size: 1.05rem;
    }
    .rec-title::before, .rec-title::after {
      content: ""; height: 1px; flex: 1; max-width: 220px; opacity: .5;
      background: linear-gradient(90deg, transparent, var(--fg-faint));
    }
    .rec-title::after { background: linear-gradient(90deg, var(--fg-faint), transparent); }
    .rec-title .book { color: var(--primary); }

    .about-text p { margin: 0 0 .85rem; color: var(--fg-light); font-size: .95rem; }
    .about-text strong { color: var(--fg); font-weight: 600; }
    .stats {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: .75rem;
      margin-top: 1.1rem;
    }
    .stat {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 16px; padding: .9rem 1rem; text-align: center;
      box-shadow: var(--shadow);
    }
    .stat .val { font-size: 1.55rem; font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums; }
    .stat .lbl { font-size: .78rem; color: var(--fg-light); margin-top: .15rem; }

    .skills-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .skill-card {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 14px; padding: .85rem 1rem;
      transition: border-color .2s, transform .2s, box-shadow .2s;
    }
    .skill-card:hover {
      border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-hover);
    }
    .skill-card h3 { margin: 0 0 .55rem; font-size: .95rem; }
    .things { display: flex; flex-wrap: wrap; gap: .35rem; }
    .thing {
      font-size: .7rem; padding: .15rem .45rem; border-radius: 999px;
      background: var(--uic-hover); color: var(--primary); border: 1px solid transparent;
    }

    .projects-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
    }
    .project-card {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 14px; padding: .85rem .95rem;
      display: flex; flex-direction: column; gap: .35rem;
      transition: border-color .2s, transform .2s, box-shadow .2s;
      text-align: left; cursor: pointer; width: 100%;
      font: inherit; color: inherit;
      min-height: 118px;
    }
    .project-card:hover {
      border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-hover);
    }
    .project-card[hidden] { display: none !important; }
    .project-top { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
    .project-card h3 { margin: 0; font-size: .92rem; font-weight: 700; color: var(--fg); }
    .badge {
      font-size: .65rem; font-weight: 600; padding: .12rem .4rem; border-radius: 999px;
      border: 1px solid var(--border);
    }
    .badge.public { color: #137333; background: #e6f4ea; border-color: #ceead6; }
    .badge.private { color: var(--fg-light); background: var(--bg-soft); }
    [data-theme="dark"] .badge.public { color: #81c995; background: #16351f; border-color: #274e32; }
    .project-card p { margin: 0; font-size: .78rem; color: var(--fg-light); flex: 1; line-height: 1.45; }
    .project-card .things .thing { font-size: .65rem; padding: .1rem .38rem; }
    .project-links { display: flex; gap: .65rem; font-size: .74rem; font-weight: 600; margin-top: .15rem; color: var(--primary); }

    .rec-list {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 18px;
      border: 1px solid var(--border); border-radius: 14px;
      padding: .35rem .55rem; background: var(--bg);
      box-shadow: var(--shadow);
    }
    .rec-item {
      display: grid; grid-template-columns: 1fr auto; gap: .15rem .75rem;
      align-items: baseline;
      padding: .55rem .55rem; border-radius: 8px;
      text-decoration: none !important; color: inherit;
      border-bottom: 1px solid var(--border-soft);
      transition: background .15s;
    }
    .rec-item:nth-last-child(-n+2) { border-bottom: 0; }
    .rec-item:hover { background: var(--uic-hover); text-decoration: none !important; }
    .rec-item h3 {
      margin: 0; font-size: .9rem; color: var(--primary); font-weight: 650;
      grid-column: 1; line-height: 1.35;
    }
    .rec-item p {
      margin: 0; font-size: .75rem; color: var(--fg-light);
      grid-column: 1; line-height: 1.4;
    }
    .rec-item .tags {
      grid-column: 2; grid-row: 1 / span 2; align-self: center;
      display: flex; flex-wrap: wrap; gap: .25rem; justify-content: flex-end;
      max-width: 9rem;
    }
    .rec-item .tags .tag-hash { font-size: .68rem; }
    .rec-note { margin: .75rem 0 0; font-size: .8rem; color: var(--fg-faint); }

    .contact-box {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 18px; padding: 1.4rem 1.5rem;
      box-shadow: var(--shadow);
    }
    .contact-box h2 { margin: 0 0 .5rem; font-size: 1.35rem; }
    .contact-box p { margin: 0 0 1rem; color: var(--fg-light); }
    .socials { display: flex; flex-wrap: wrap; gap: .6rem; }
    .social {
      display: inline-flex; align-items: center; gap: .45rem;
      padding: .45rem .9rem; border-radius: 999px;
      background: var(--bg-soft); color: var(--fg) !important;
      text-decoration: none !important; font-size: .88rem; font-weight: 500;
      border: 1px solid var(--border);
    }
    .social:hover { border-color: var(--primary); color: var(--primary) !important; }
    .social svg { width: 16px; height: 16px; fill: currentColor; }

    .reveal { opacity: 0; transform: translateY(8px); transition: opacity .4s ease, transform .4s ease; }
    .reveal.in { opacity: 1; transform: none; }

    .site-footer {
      background: var(--bg-footer); color: var(--fg-light);
      border-top: 1px solid var(--border);
      padding: 1.15rem 1.5rem; font-size: .82rem;
    }
    .footer-inner {
      max-width: 1280px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      flex-wrap: wrap;
    }
    .footer-copy { margin: 0; }
    .footer-socials { display: flex; align-items: center; gap: .35rem; }
    .footer-socials a {
      width: 34px; height: 34px; border-radius: 10px;
      display: grid; place-items: center; color: var(--fg-light) !important;
      text-decoration: none !important;
    }
    .footer-socials a:hover { background: var(--uic-hover); color: var(--primary) !important; }
    .footer-socials svg { width: 17px; height: 17px; fill: currentColor; }

    .drawer-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 120;
    }
    .drawer-overlay.open { display: block; }

    .drawer-tags { display: flex; flex-wrap: wrap; gap: .35rem; }
    .drawer-tags .thing { font-size: .75rem; }

    @media (max-width: 960px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed; left: 0; top: 0; bottom: 0; z-index: 130;
        width: min(280px, 86vw); height: 100vh !important; background: var(--bg);
        transform: translateX(-105%); transition: transform .25s ease;
        border-right: 1px solid var(--border);
        padding-top: 1rem;
      }
      .sidebar.open { transform: none; }
      .menu-toggle { display: grid; }
      .search-chip .label { display: none; }
      .search-chip { padding: 0 .55rem; }
      .theme-wrap .lbl { display: none; }
      .gh-source span.repo { display: none; }
      .hero-wrapper {
        flex-direction: column-reverse; text-align: center;
        padding: 1.25rem .9rem; gap: 1.2rem;
      }
      .hero-content { text-align: center; }
      .typewriter-row, .hero-btns { justify-content: center; }
      .hero-motto { margin-left: auto; margin-right: auto; }
      .avatar-glow { width: 7.5rem; height: 7.5rem; margin: 0 auto; }
      .avatar-inner { font-size: 2.4rem; }
      .hero-title { font-size: 1.65rem; }
      .hero-intro { font-size: 1.2rem; }
      .grid-container, .projects-grid, .skills-grid { grid-template-columns: 1fr; }
      .rec-list { grid-template-columns: 1fr; gap: 0; padding: .2rem .35rem; }
      .rec-item { grid-template-columns: 1fr; border-bottom: 1px solid var(--border-soft); }
      .rec-item:last-child { border-bottom: 0; }
      .rec-item .tags { grid-column: 1; grid-row: auto; justify-content: flex-start; max-width: none; margin-top: .2rem; }
      .stats { grid-template-columns: 1fr; }
      .footer-inner { justify-content: center; text-align: center; }
    }
    @media (max-width: 520px) {
      .search-chip .hint { display: none; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <button class="icon-btn menu-toggle" id="menuBtn" aria-label="打开导航" type="button" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M4 12h16M4 19h16"/></svg>
      </button>
      <a class="brand" href="#top">
        <span class="brand-mark" aria-hidden="true">i6</span>
        <span id="brandName">ibi6</span>
      </a>
      <div class="header-spacer"></div>
      <button class="search-chip" id="searchChip" type="button" title="跳到项目（Ctrl+K）" aria-label="查找项目">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span class="label">查找</span>
        <span class="hint">Ctrl+K</span>
      </button>
      <div class="header-actions">
        <div class="theme-wrap" id="themeSwitchHost" title="浅色 / 深色">
          <span class="lbl" aria-hidden="true">主题</span>
        </div>
        <a class="gh-source" id="headerGithub" href="https://github.com/ibi6" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24"><path d="M12 .5C5.73.5.5 5.74.5 12.02c0 5.1 3.29 9.42 7.86 10.95.58.11.79-.25.79-.56v-2.02c-3.2.7-3.87-1.54-3.87-1.54-.53-1.36-1.3-1.72-1.3-1.72-1.06-.73.08-.72.08-.72 1.17.08 1.79 1.2 1.79 1.2 1.04 1.8 2.73 1.28 3.4.98.1-.76.41-1.28.74-1.57-2.6-.3-5.34-1.31-5.34-5.83 0-1.29.46-2.34 1.21-3.17-.12-.3-.52-1.52.11-3.17 0 0 .99-.32 3.24 1.21a11.2 11.2 0 0 1 5.9 0c2.25-1.53 3.23-1.21 3.23-1.21.64 1.65.24 2.87.12 3.17.76.83 1.21 1.88 1.21 3.17 0 4.53-2.75 5.53-5.37 5.82.42.37.8 1.1.8 2.22v3.29c0 .31.21.68.8.56A10.53 10.53 0 0 0 23.5 12C23.5 5.74 18.27.5 12 .5z"/></svg>
          <span class="repo">ibi6</span>
        </a>
      </div>
    </div>
  </header>

  <nav class="tabs-bar" aria-label="主导航">
    <div class="tabs-inner" id="navLinks">
      <a href="#top" class="active" data-tab>首页</a>
      <a href="#about" data-tab>关于</a>
      <a href="#skills" data-tab>能力</a>
      <a href="#projects" data-tab>项目</a>
      <a href="#recommends" data-tab>推荐</a>
      <a href="#contact" data-tab>联系</a>
    </div>
  </nav>

  <div class="drawer-overlay" id="drawerOverlay"></div>

  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="侧栏导航">
      <h4>本站</h4>
      <a href="#top" data-side>欢迎</a>
      <a href="#categories" data-side>分类</a>
      <a href="#about" data-side>关于</a>
      <h4>作品</h4>
      <a href="#skills" data-side>技术能力</a>
      <a href="#projects" data-side>我的项目</a>
      <a href="#recommends" data-side>推荐阅读</a>
      <h4>联系</h4>
      <a href="#contact" data-side>聊聊</a>
      <a href="https://github.com/ibi6" target="_blank" rel="noopener">GitHub ↗</a>
      <a href="https://ibi6.github.io/ui-components-oss/" target="_blank" rel="noopener">组件库 ↗</a>
    </aside>

    <main class="main">
      <div class="home">
        <section id="top" class="reveal">
          <div class="hero-wrapper">
            <div class="hero-content">
              <p class="hero-title">Hi, I'm <span class="marker" id="heroName">Hang</span>.</p>
              <p class="hero-intro" id="heroWelcome">Welcome to my hub! 👋</p>
              <div class="typewriter-row">
                <span id="typewriter"></span><span class="cursor" aria-hidden="true"></span>
              </div>
              <p class="hero-motto" id="heroSub"></p>
              <div class="hero-btns" id="heroBtns"></div>
            </div>
            <div class="avatar-glow" id="avatarWrap" aria-hidden="true">
              <div class="avatar-inner" id="avatarLetter">H</div>
            </div>
          </div>
        </section>

        <section id="categories" class="reveal">
          <div class="grid-container" id="hubGrid"></div>
        </section>

        <section id="about" class="section reveal">
          <div class="section-head"><h2>关于我</h2></div>
          <p class="section-desc" id="aboutDesc"></p>
          <div class="about-text" id="aboutText"></div>
          <div class="stats" id="statsWrap"></div>
        </section>

        <section id="skills" class="section reveal">
          <div class="section-head"><h2>技术能力</h2></div>
          <p class="section-desc" id="skillsDesc"></p>
          <div class="skills-grid" id="skillsGrid"></div>
        </section>

        <section id="projects" class="section reveal">
          <div class="section-head">
            <h2>我的项目</h2>
            <div class="uic-filter" id="projectFilter" role="tablist" aria-label="项目筛选"></div>
          </div>
          <p class="section-desc" id="projectsDesc"></p>
          <div class="projects-grid" id="projectsGrid"></div>
        </section>

        <h3 class="rec-title reveal"><span class="book" aria-hidden="true">📖</span> 推荐阅读</h3>

        <section id="recommends" class="section reveal" style="margin-top:0">
          <p class="section-desc" id="recommendsDesc"></p>
          <div class="rec-list" id="recommendsList"></div>
          <p class="rec-note" id="recommendsNote"></p>
        </section>

        <section id="contact" class="section reveal">
          <div class="contact-box">
            <h2 id="contactHeading">聊聊技术</h2>
            <p id="contactIntro"></p>
            <div class="socials" id="socialsWrap"></div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <footer class="site-footer" id="footerWrap"></footer>

  <script src="./vendor/ui-kit.js"></script>
  <script src="./content.js"></script>
  <script>
  (function () {
    const D = window.PORTFOLIO_DATA;
    if (!D) return;
    const UIC = window.UIC || {};

    const $ = (id) => document.getElementById(id);
    const md = (s) => String(s || '').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    const esc = (s) => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    const icons = {
      github: '<svg viewBox="0 0 24 24"><path d="M12 .5C5.73.5.5 5.74.5 12.02c0 5.1 3.29 9.42 7.86 10.95.58.11.79-.25.79-.56v-2.02c-3.2.7-3.87-1.54-3.87-1.54-.53-1.36-1.3-1.72-1.3-1.72-1.06-.73.08-.72.08-.72 1.17.08 1.79 1.2 1.79 1.2 1.04 1.8 2.73 1.28 3.4.98.1-.76.41-1.28.74-1.57-2.6-.3-5.34-1.31-5.34-5.83 0-1.29.46-2.34 1.21-3.17-.12-.3-.52-1.52.11-3.17 0 0 .99-.32 3.24 1.21a11.2 11.2 0 0 1 5.9 0c2.25-1.53 3.23-1.21 3.23-1.21.64 1.65.24 2.87.12 3.17.76.83 1.21 1.88 1.21 3.17 0 4.53-2.75 5.53-5.37 5.82.42.37.8 1.1.8 2.22v3.29c0 .31.21.68.8.56A10.53 10.53 0 0 0 23.5 12C23.5 5.74 18.27.5 12 .5z"/></svg>',
      link: '<svg viewBox="0 0 24 24"><path d="M3.9 12a5 5 0 0 1 5-5h4v2h-4a3 3 0 1 0 0 6h4v2h-4a5 5 0 0 1-5-5m7-1h6v2h-6zm4.1-4h4a5 5 0 0 1 0 10h-4v-2h4a3 3 0 1 0 0-6h-4z"/></svg>'
    };
    const jumpIcon = '<svg class="jump" viewBox="0 0 24 24"><path d="M5 17.59L15.59 7H9V5h10v10h-2V8.41L6.41 19 5 17.59z"/></svg>';

    const root = document.documentElement;
    function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    function applyTheme(mode) {
      root.setAttribute('data-theme', mode);
      lsSet('ibi6-theme', mode);
    }
    const initialTheme = root.getAttribute('data-theme') || 'light';
    applyTheme(initialTheme);

    /* UIC Switch for theme */
    if (UIC.Switch) {
      UIC.Switch($('themeSwitchHost'), {
        checked: initialTheme === 'dark',
        label: '切换深色主题',
        onChange: function (on) {
          applyTheme(on ? 'dark' : 'light');
          if (UIC.toast) UIC.toast.info(on ? '已切换到深色' : '已切换到浅色', '主题');
        }
      });
    }

    /* mobile sidebar drawer (existing) */
    const sidebar = $('sidebar');
    const overlay = $('drawerOverlay');
    function closeDrawer() {
      sidebar.classList.remove('open');
      overlay.classList.remove('open');
      $('menuBtn').setAttribute('aria-expanded', 'false');
    }
    function openNavDrawer() {
      sidebar.classList.add('open');
      overlay.classList.add('open');
      $('menuBtn').setAttribute('aria-expanded', 'true');
    }
    $('menuBtn').addEventListener('click', () => {
      if (sidebar.classList.contains('open')) closeDrawer(); else openNavDrawer();
    });
    overlay.addEventListener('click', closeDrawer);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });
    sidebar.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
      if (window.matchMedia('(max-width: 960px)').matches) closeDrawer();
    }));

    function focusProjects() {
      const el = $('projects');
      if (!el) return;
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      setActive('projects');
    }
    $('searchChip').addEventListener('click', focusProjects);
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) {
        e.preventDefault();
        focusProjects();
      }
    });

    const p = D.profile;
    document.title = p.siteTitle || 'Hang';
    $('brandName').textContent = p.brand || 'ibi6';
    $('heroName').textContent = [p.firstName, p.lastName].filter(Boolean).join(' ') || 'Hang';
    $('heroWelcome').textContent = p.welcome || 'Welcome to my hub! 👋';
    $('heroSub').textContent = p.motto || p.summary || '';
    $('headerGithub').href = p.github || 'https://github.com/ibi6';

    const wrap = $('avatarWrap');
    if (p.avatar) {
      wrap.innerHTML = '<img src="' + esc(p.avatar) + '" alt="" width="176" height="176" loading="eager" decoding="async" />';
    } else {
      $('avatarLetter').textContent = (p.firstName || 'H').charAt(0).toUpperCase();
    }

    $('heroBtns').innerHTML =
      '<a class="uic-btn" href="' + esc(p.github || 'https://github.com/ibi6') + '" target="_blank" rel="noopener">' + icons.github + ' GitHub</a>' +
      '<a class="uic-btn ghost" href="#projects">浏览项目</a>' +
      '<a class="uic-btn ghost" href="https://ibi6.github.io/ui-components-oss/" target="_blank" rel="noopener">组件库</a>';

    const phrases = (p.typing && p.typing.length) ? p.typing : ['开源作品'];
    let pi = 0, ci = 0, deleting = false;
    const tw = $('typewriter');
    function tick() {
      const cur = phrases[pi];
      if (!deleting) {
        ci++;
        tw.textContent = cur.slice(0, ci);
        if (ci === cur.length) { deleting = true; setTimeout(tick, 1400); return; }
        setTimeout(tick, 70);
      } else {
        ci--;
        tw.textContent = cur.slice(0, ci);
        if (ci === 0) { deleting = false; pi = (pi + 1) % phrases.length; setTimeout(tick, 320); return; }
        setTimeout(tick, 38);
      }
    }
    tick();

    $('hubGrid').innerHTML = (D.hubCategories || []).map(c =>
      '<a class="grid-card" href="' + esc(c.href) + '">' +
        '<h3><span class="ico">' + (c.icon || '') + '</span> ' + esc(c.title) + '</h3>' +
        '<p>' + esc(c.desc) + '</p>' +
        '<div class="tag-box">' +
          '<span class="tag-link">' + esc(c.linkLabel || '进入') + jumpIcon + '</span>' +
          (c.tags || []).map(t => '<span class="tag-hash">' + esc(t) + '</span>').join('') +
        '</div>' +
      '</a>'
    ).join('');

    $('aboutDesc').textContent = D.about.desc || '';
    $('aboutText').innerHTML = (D.about.paragraphs || []).map(x => '<p>' + md(x) + '</p>').join('');
    $('statsWrap').innerHTML = (D.about.stats || []).map(s =>
      '<div class="stat">' +
        '<div class="val"><span data-count="' + s.value + '">0</span>' + esc(s.suffix || '') + '</div>' +
        '<div class="lbl">' + esc(s.label) + '</div>' +
      '</div>'
    ).join('');

    $('skillsDesc').textContent = D.skills.desc || '';
    $('skillsGrid').innerHTML = (D.skills.groups || []).map(g =>
      '<div class="skill-card">' +
        '<h3>' + esc(g.name) + '</h3>' +
        '<div class="things">' + (g.items || []).map(i => '<span class="thing">' + esc(i) + '</span>').join('') + '</div>' +
      '</div>'
    ).join('');

    /* projects + filter + detail drawer */
    const projectItems = D.projects.items || [];
    const FILTERS = [
      { id: 'all', label: '全部' },
      { id: '桌面', label: '桌面' },
      { id: '前端', label: 'Web' },
      { id: '安全', label: '安全' },
      { id: '运维', label: '运维' },
      { id: '实验', label: '实验' }
    ];
    function matchFilter(item, fid) {
      if (fid === 'all') return true;
      const tags = (item.tags || []).join(' ');
      const blob = (item.name + ' ' + item.tagline + ' ' + tags);
      if (fid === '前端') return /前端|UI|Web|组件|可视化|Pages/i.test(blob);
      if (fid === '实验') return /实验|生成式|创意|可视化|导航|OSS/i.test(blob);
      return tags.indexOf(fid) >= 0 || blob.indexOf(fid) >= 0;
    }

    $('projectsDesc').textContent = D.projects.desc || '';
    $('projectsGrid').innerHTML = projectItems.map((item, idx) => {
      const vis = (item.visibility || 'public').toLowerCase();
      return (
        '<button type="button" class="project-card" data-idx="' + idx + '" data-filter-item>' +
          '<div class="project-top">' +
            '<h3>' + esc(item.name) + '</h3>' +
            '<span class="badge ' + vis + '">' + (vis === 'public' ? 'Public' : 'Private') + '</span>' +
          '</div>' +
          '<p>' + esc(item.tagline) + '</p>' +
          '<div class="things">' + (item.tags || []).map(t => '<span class="thing">' + esc(t) + '</span>').join('') + '</div>' +
          '<div class="project-links">点击查看详情</div>' +
        '</button>'
      );
    }).join('');

    const filterHost = $('projectFilter');
    filterHost.innerHTML = FILTERS.map((f, i) =>
      '<button type="button" role="tab" data-filter="' + esc(f.id) + '" aria-selected="' + (i === 0 ? 'true' : 'false') + '">' + esc(f.label) + '</button>'
    ).join('');

    function applyFilter(fid) {
      filterHost.querySelectorAll('button').forEach(b => {
        b.setAttribute('aria-selected', b.getAttribute('data-filter') === fid ? 'true' : 'false');
      });
      document.querySelectorAll('#projectsGrid [data-filter-item]').forEach(card => {
        const idx = Number(card.getAttribute('data-idx'));
        const ok = matchFilter(projectItems[idx], fid);
        card.hidden = !ok;
      });
    }
    filterHost.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-filter]');
      if (!btn) return;
      applyFilter(btn.getAttribute('data-filter'));
    });

    const detailDrawer = UIC.Drawer ? UIC.Drawer({ side: 'right' }) : null;
    function openProject(idx) {
      const item = projectItems[idx];
      if (!item || !detailDrawer) return;
      const vis = (item.visibility || 'public').toLowerCase();
      const tags = (item.tags || []).map(t => '<span class="thing">' + esc(t) + '</span>').join('');
      const link = item.github || item.homepage || '';
      detailDrawer.open({
        title: item.name,
        bodyHtml:
          '<p style="margin:0;color:var(--uic-mute)">' + esc(item.tagline) + '</p>' +
          '<div class="drawer-tags">' + tags + '</div>' +
          '<p class="uic-drawer-note">可见性：' + (vis === 'public' ? 'Public' : 'Private（访客可能 404）') + '</p>',
        footerHtml:
          (item.github ? '<a class="uic-btn" href="' + esc(item.github) + '" target="_blank" rel="noopener">GitHub</a>' : '') +
          (item.homepage ? '<a class="uic-btn ghost" href="' + esc(item.homepage) + '" target="_blank" rel="noopener">主页</a>' : '') +
          (link ? '<button type="button" class="uic-btn ghost" data-copy="' + esc(link) + '">复制链接</button>' : '')
      });
    }
    $('projectsGrid').addEventListener('click', (e) => {
      const card = e.target.closest('.project-card');
      if (!card) return;
      openProject(Number(card.getAttribute('data-idx')));
    });
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-copy]');
      if (!btn) return;
      const url = btn.getAttribute('data-copy');
      const done = () => { if (UIC.toast) UIC.toast.success('已复制链接', '剪贴板'); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(done).catch(() => {
          const ta = document.createElement('textarea');
          ta.value = url; document.body.appendChild(ta); ta.select();
          try { document.execCommand('copy'); done(); } catch (err) {}
          ta.remove();
        });
      } else {
        done();
      }
    });

    $('recommendsDesc').textContent = D.recommends.desc || '';
    $('recommendsList').innerHTML = (D.recommends.items || []).map(r =>
      '<a class="rec-item" href="' + esc(r.url) + '" target="_blank" rel="noopener">' +
        '<h3>' + esc(r.name) + '</h3>' +
        '<p>' + esc(r.tagline) + '</p>' +
        '<div class="tags">' + (r.tags || []).map(t => '<span class="tag-hash">' + esc(t) + '</span>').join('') + '</div>' +
      '</a>'
    ).join('');
    if (D.recommends.note) {
      const note = D.recommends.noteUrl
        ? esc(D.recommends.note) + ' · <a href="' + esc(D.recommends.noteUrl) + '" target="_blank" rel="noopener">open-source-treasure</a>'
        : esc(D.recommends.note);
      $('recommendsNote').innerHTML = note;
    }

    $('contactHeading').textContent = (D.contact.heading || '').replace(/<[^>]+>/g, '');
    $('contactIntro').textContent = D.contact.intro || D.contact.desc || '';
    $('socialsWrap').innerHTML = (D.contact.socials || []).map(s =>
      '<a class="social" href="' + esc(s.url) + '" target="_blank" rel="noopener">' +
        (icons[s.icon] || icons.link) + ' ' + esc(s.label) +
      '</a>'
    ).join('');

    const year = new Date().getFullYear();
    const socialFooter = (D.contact.socials || []).map(s =>
      '<a href="' + esc(s.url) + '" target="_blank" rel="noopener" aria-label="' + esc(s.label) + '" title="' + esc(s.label) + '">' +
        (icons[s.icon] || icons.link) +
      '</a>'
    ).join('');
    $('footerWrap').innerHTML =
      '<div class="footer-inner">' +
        '<p class="footer-copy">© ' + year + ' ' + esc(p.footerName || p.firstName || 'Hang') +
          (D.footer && D.footer.note ? ' · ' + esc(D.footer.note) : '') + '</p>' +
        '<div class="footer-socials">' + socialFooter + '</div>' +
      '</div>';

    function animateCount(el) {
      if (el.dataset.done) return;
      el.dataset.done = '1';
      const target = Number(el.getAttribute('data-count') || 0);
      const start = performance.now();
      const dur = 900;
      function frame(t) {
        const k = Math.min(1, (t - start) / dur);
        const eased = 1 - Math.pow(1 - k, 3);
        el.textContent = String(Math.round(target * eased));
        if (k < 1) requestAnimationFrame(frame);
        else el.textContent = String(target);
      }
      requestAnimationFrame(frame);
    }

    const sections = ['top','categories','about','skills','projects','recommends','contact'];
    const io = new IntersectionObserver((entries) => {
      entries.forEach(en => {
        if (en.isIntersecting) {
          en.target.classList.add('in');
          en.target.querySelectorAll('[data-count]').forEach(animateCount);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
    document.querySelectorAll('.reveal').forEach(el => io.observe(el));
    setTimeout(() => {
      document.querySelectorAll('[data-count]').forEach(el => {
        if (!el.dataset.done) {
          const r = el.getBoundingClientRect();
          if (r.top < window.innerHeight && r.bottom > 0) animateCount(el);
        }
      });
    }, 600);

    const tabLinks = Array.from(document.querySelectorAll('#navLinks [data-tab]'));
    const sideLinks = Array.from(document.querySelectorAll('#sidebar [data-side]'));
    function setActive(id) {
      const map = { categories: 'top', top: 'top' };
      const tabId = map[id] || id;
      tabLinks.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + tabId));
      sideLinks.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + id));
    }
    const spy = new IntersectionObserver((entries) => {
      const visible = entries
        .filter(e => e.isIntersecting)
        .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
      if (visible && visible.target && visible.target.id) setActive(visible.target.id);
    }, { rootMargin: '-28% 0px -55% 0px', threshold: [0, 0.15, 0.35, 0.55, 0.75] });
    sections.forEach(id => { const el = document.getElementById(id); if (el) spy.observe(el); });
    tabLinks.concat(sideLinks).forEach(a => {
      a.addEventListener('click', () => {
        const href = a.getAttribute('href') || '';
        if (href.startsWith('#')) setActive(href.slice(1));
      });
    });
  })();
  </script>

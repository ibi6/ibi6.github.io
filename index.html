<style>
/* ================= 设计变量 ================= */
:root{
  --accent:#e0522a;
  --accent-soft:rgba(224,82,42,.12);
  --teal:#11624e;
  --paper:#f4efe5;
  --paper-2:#ece4d3;
  --card:#fbf8f1;
  --ink:#171310;
  --ink-dim:#5f574b;
  --ink-faint:#9a9080;
  --line:rgba(23,19,16,.14);
  --line-strong:rgba(23,19,16,.32);
  --shadow:0 30px 70px -40px rgba(23,19,16,.5);
  --serif:Georgia,"Times New Roman","Noto Serif SC","Songti SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --ease:cubic-bezier(.22,.61,.36,1);
}
[data-theme="dark"]{
  --accent:#ff6b3d;
  --accent-soft:rgba(255,107,61,.14);
  --teal:#4fc3a0;
  --paper:#15110c;
  --paper-2:#1c1711;
  --card:#1e1812;
  --ink:#f2ece0;
  --ink-dim:#a89d8a;
  --ink-faint:#6f6657;
  --line:rgba(242,236,224,.14);
  --line-strong:rgba(242,236,224,.34);
  --shadow:0 30px 70px -40px rgba(0,0,0,.8);
}
/* ================= 基础 ================= */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans);
  background:var(--paper);
  color:var(--ink);
  line-height:1.75;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  transition:background-color .4s var(--ease),color .4s var(--ease);
  background-image:
    radial-gradient(1200px 600px at 85% -10%,var(--accent-soft),transparent 60%),
    radial-gradient(900px 500px at -10% 30%,rgba(17,98,78,.06),transparent 55%);
  background-repeat:no-repeat;
}
[data-theme="dark"] body{background-image:
    radial-gradient(1200px 600px at 85% -10%,var(--accent-soft),transparent 60%),
    radial-gradient(900px 500px at -10% 30%,rgba(79,195,160,.05),transparent 55%)}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
a{color:inherit}
img,svg{display:block}
.mono{font-family:var(--mono);font-size:.82rem;letter-spacing:.04em}
.serif{font-family:var(--serif)}
.noscript-tip{max-width:640px;margin:120px auto;padding:24px;text-align:center;color:var(--ink-dim)}
.draft-badge{
  position:fixed;left:20px;bottom:20px;z-index:85;
  display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;
  font-family:var(--mono);font-size:.76rem;
  background:var(--card);border:1px solid var(--line-strong);color:var(--ink);
  box-shadow:var(--shadow);
}
.draft-badge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
/* 滚动入场 */
html.js .reveal{opacity:0;transform:translateY(26px);transition:opacity .8s var(--ease),transform .8s var(--ease);transition-delay:var(--d,0s)}
html.js .reveal.visible{opacity:1;transform:none}
/* 顶部进度条 */
.progress{position:fixed;top:0;left:0;height:2px;width:0;background:var(--accent);z-index:100}
/* ================= 导航 ================= */
.nav{position:fixed;top:0;left:0;right:0;z-index:50;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--paper) 86%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);}
.nav-inner{max-width:1120px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:66px;padding:0 28px}
.logo{font-family:var(--serif);font-style:italic;font-size:1.4rem;font-weight:700;text-decoration:none;letter-spacing:.01em;display:flex;align-items:baseline;gap:6px}
.logo small{font-family:var(--mono);font-style:normal;font-size:.72rem;color:var(--accent);font-weight:400}
.nav-links{display:flex;gap:2px}
.nav-links a{color:var(--ink-dim);text-decoration:none;font-size:.9rem;padding:8px 14px;border-radius:999px;transition:color .2s,background-color .2s}
.nav-links a:hover{color:var(--ink)}
.nav-links a.active{color:var(--ink);background:var(--accent-soft)}
.nav-actions{display:flex;align-items:center;gap:10px}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line-strong);
  background:var(--card);color:var(--ink);cursor:pointer;position:relative;
  display:flex;align-items:center;justify-content:center;transition:border-color .25s,transform .25s var(--ease)}
.icon-btn:hover{border-color:var(--accent);transform:translateY(-2px)}
.icon-btn svg{width:18px;height:18px}
.theme-toggle{overflow:hidden}
.theme-toggle svg{position:absolute;opacity:0;transition:opacity .3s,transform .3s var(--ease);transform:rotate(-60deg) scale(.6)}
[data-mode="auto"] .theme-toggle .ic-auto{opacity:1;transform:none}
[data-mode="light"] .theme-toggle .ic-sun{opacity:1;transform:none}
[data-mode="dark"] .theme-toggle .ic-moon{opacity:1;transform:none}
.hamburger{display:none;flex-direction:column;gap:5px}
.hamburger span{display:block;width:18px;height:1.5px;border-radius:2px;background:currentColor;transition:transform .3s var(--ease),opacity .3s}
.nav.open .hamburger span:nth-child(1){transform:translateY(6.5px) rotate(45deg)}
.nav.open .hamburger span:nth-child(2){opacity:0}
.nav.open .hamburger span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}
/* ================= Hero ================= */
.hero{position:relative;max-width:1120px;margin:0 auto;min-height:88vh;display:flex;align-items:center;padding:140px 28px 90px}
.hero-inner{position:relative;width:100%}
.hero-kicker{font-family:var(--mono);font-size:.78rem;color:var(--accent);letter-spacing:.18em;text-transform:uppercase;margin-bottom:26px;display:flex;align-items:center;gap:14px}
.hero-kicker::before{content:"";width:34px;height:1px;background:var(--accent)}
.hero-name{font-family:var(--serif);font-size:clamp(3rem,9vw,6.6rem);font-weight:800;line-height:.98;letter-spacing:-.02em}
.hero-name em{font-style:italic;color:var(--accent)}
.hero-handle{margin-top:22px;font-family:var(--mono);font-size:.86rem;color:var(--ink-dim)}
.hero-handle a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line-strong)}
.hero-handle a:hover{color:var(--accent);border-color:var(--accent)}
.hero-role{font-family:var(--serif);font-size:clamp(1.05rem,2.2vw,1.35rem);color:var(--ink);margin-top:10px}
.hero-role .typed{font-style:italic;color:var(--accent)}
.caret{display:inline-block;width:2px;height:1em;background:var(--accent);vertical-align:-.12em;margin-left:3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hero-sub{color:var(--ink-dim);max-width:560px;margin-top:26px;font-size:.98rem}
.hero-cta{display:flex;gap:30px;flex-wrap:wrap;margin-top:44px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:0 0 4px;font-family:var(--mono);font-size:.86rem;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line-strong);transition:color .2s,border-color .2s}
.btn .arr{display:inline-block;transition:transform .25s var(--ease)}
.btn:hover{color:var(--accent);border-color:var(--accent)}
.btn:hover .arr{transform:translateX(5px)}
.btn-primary{color:var(--accent);border-bottom-style:dashed}
/* ================= 区块通用 ================= */
.section{max-width:1120px;margin:0 auto;padding:90px 28px;scroll-margin-top:70px}
.section-head{margin-bottom:40px;display:flex;align-items:baseline;gap:22px;flex-wrap:wrap}
.sec-num{font-family:var(--mono);font-size:.8rem;color:var(--accent)}
.section-title{font-family:var(--serif);font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800;letter-spacing:-.01em}
.section-title em,.section-title .em{font-style:italic;color:var(--accent)}
.section-desc{color:var(--ink-dim);font-size:.92rem}
.sec-rule{height:2px;background:var(--ink);margin-bottom:44px;position:relative}
.sec-rule small{position:absolute;right:0;bottom:8px;font-family:var(--mono);font-size:.7rem;color:var(--ink-faint)}
/* ================= 关于 ================= */
.about-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:60px;border-top:2px solid var(--ink);padding-top:44px}
.about-text p{font-family:var(--serif);font-size:1.08rem;line-height:1.85;margin-bottom:20px;color:var(--ink-dim)}
.about-text p strong{color:var(--ink)}
.about-text p em{color:var(--accent);font-style:italic}
.about-text p:first-child{font-size:1.34rem;line-height:1.7;color:var(--ink)}
.stats{display:flex;flex-direction:column}
.stat{border-top:1px solid var(--line-strong);padding:20px 0;display:flex;align-items:baseline;justify-content:space-between;gap:20px}
.stat-num{font-family:var(--serif);font-size:2.4rem;font-weight:800;letter-spacing:-.02em;color:var(--accent)}
.stat-label{font-family:var(--mono);font-size:.76rem;color:var(--ink-dim);text-align:right}
/* ================= 能力 ================= */
.skills-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.skill-card{background:var(--card);padding:28px 26px}
.skill-card h3{font-family:var(--mono);font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:20px;display:flex;align-items:center;gap:12px}
.skill-card h3::before{content:"";width:14px;height:2px;background:var(--accent)}
.skill-things{display:flex;flex-wrap:wrap;gap:9px}
.thing{font-family:var(--serif);font-size:.98rem;color:var(--ink);border:1px solid var(--line-strong);border-radius:999px;padding:6px 16px;transition:border-color .2s,color .2s}
.thing:hover{border-color:var(--accent);color:var(--accent)}
/* ================= 联系 ================= */
.contact-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:60px;border-top:2px solid var(--ink);padding-top:44px}
.contact-heading{font-family:var(--serif);font-size:clamp(1.7rem,3.6vw,2.4rem);font-weight:800;line-height:1.15}
.contact-heading em{font-style:italic;color:var(--accent)}
.contact-intro{color:var(--ink-dim);margin-top:18px;max-width:46ch}
.contact-email{margin-top:24px;font-family:var(--mono);font-size:.92rem}
.contact-email a{color:var(--accent);text-decoration:none;border-bottom:1px dashed var(--accent)}
.socials{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
.social{font-family:var(--mono);font-size:.8rem;color:var(--ink);text-decoration:none;border:1px solid var(--line-strong);border-radius:999px;padding:8px 18px;display:inline-flex;align-items:center;gap:8px;transition:border-color .2s,color .2s,transform .2s var(--ease)}
.social:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
.social svg{width:16px;height:16px}
.form{display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font-family:var(--mono);font-size:.76rem;letter-spacing:.06em;color:var(--ink-dim)}
.field input,.field textarea{font-family:var(--sans);font-size:.96rem;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line-strong);padding:10px 2px;transition:border-color .2s;resize:vertical}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.field input::placeholder,.field textarea::placeholder{color:var(--ink-faint)}
.field.err input,.field.err textarea{border-color:var(--accent)}
.field-msg{display:none;font-size:.76rem;color:var(--accent)}
.field.err .field-msg{display:block}
.form .btn{align-self:flex-start;background:none;border:0;border-bottom:1px dashed var(--accent);color:var(--accent);cursor:pointer;font-size:.88rem;padding:6px 2px;margin-top:8px}
.form .btn:hover{color:var(--ink);border-color:var(--ink)}
.toast{position:fixed;right:24px;bottom:24px;z-index:90;background:var(--ink);color:var(--paper);padding:14px 20px;border-radius:10px;font-size:.86rem;box-shadow:var(--shadow);opacity:0;transform:translateY(12px);transition:opacity .3s,transform .3s var(--ease);pointer-events:none;max-width:80vw}
.toast.show{opacity:1;transform:none}
.toast .tick{color:var(--accent);margin-right:8px}
/* ================= 页脚 ================= */
.footer-inner{max-width:1120px;margin:0 auto;padding:40px 28px 70px;display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap;color:var(--ink-dim);font-size:.84rem;border-top:1px solid var(--line-strong)}
#toTop{position:fixed;right:24px;bottom:24px;z-index:80;width:42px;height:42px;border-radius:12px;border:1px solid var(--line-strong);background:var(--card);color:var(--ink);cursor:pointer;opacity:0;transform:translateY(10px);transition:opacity .3s,transform .3s var(--ease);display:flex;align-items:center;justify-content:center}
#toTop.show{opacity:1;transform:none}
#toTop:hover{border-color:var(--accent);color:var(--accent)}
/* ================= 响应式 ================= */
@media (max-width:860px){
  .about-grid,.contact-grid{grid-template-columns:1fr;gap:40px}
}
@media (max-width:760px){
  .nav-links{position:fixed;inset:66px 0 auto 0;flex-direction:column;background:var(--paper);border-bottom:1px solid var(--line);padding:12px 20px 22px;gap:6px;transform:translateY(-16px);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s var(--ease)}
  .nav.open .nav-links{transform:none;opacity:1;pointer-events:auto}
  .nav-links a{font-size:1.02rem;padding:10px 12px}
  .hamburger{display:flex}
  .hero{min-height:76vh;padding-top:120px}
  .section-desc{width:100%}
  .stats .stat-num{font-size:2rem}
  .footer-inner{padding-bottom:90px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  html.js .reveal{opacity:1;transform:none}
}
</style>
</head>

        <svg class="ic-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>

<main>
  <!-- ===== Hero ===== -->
  <section class="hero" id="hero">
    <div class="hero-inner">
      <p class="hero-kicker reveal" id="heroKicker"></p>
      <h1 class="hero-name reveal" id="heroName"></h1>
      <p class="hero-handle reveal"><a href="https://github.com/ibi6" target="_blank" rel="noopener">github.com/ibi6</a></p>
      <p class="hero-role reveal">我在做 <span class="typed" id="typed"></span><span class="caret" aria-hidden="true"></span></p>

      <div class="hero-cta reveal">
        <a class="btn btn-primary" href="#about">了解更多<span class="arr">→</span></a>

      </div>

  <!-- ===== 关于 ===== -->

      <p class="section-desc" id="aboutDesc"></p>

      <p class="section-desc" id="skillsDesc"></p>

    <div class="skills-grid" id="skillsGrid"></div>

          <label for="message">想说的话</label>
          <textarea id="message" name="message" rows="4" placeholder="聊聊项目、合作或想法……"></textarea>
          <p class="field-msg">请至少输入 5 个字符</p>

        <button type="submit" class="btn">发送消息<span class="arr">→</span></button>
      </form>
    </div>
  </section>
</main>

  </div>
</footer>

<script src="content.js"></script>
<script>
(function () {
  var doc = document, html = doc.documentElement;
  var P = window.PORTFOLIO_DATA;
  if (!P) { return; }
  var D = P.profile, A = P.about, S = P.skills, C = P.contact, F = P.footer;
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var isDraft = /[?&]draft/.test(location.search) || /[?&]preview/.test(location.search);
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; }); }
  function rich(s){ return String(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); }
  function delay(i){ return ' style="--d:' + (i * 0.08) + 's"'; }
  function outLink(url, label, blank){
    if (!url) return '';
    return '<a class="social" href="' + esc(url) + '"' + (blank ? ' target="_blank" rel="noopener"' : '') + '>' + esc(label) + ' <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><polyline points="8 7 17 7 17 16"/></svg></a>';
  }
  var $ = function(id){ return doc.getElementById(id); };

  function render(){
    doc.title = D.siteTitle || (D.firstName + ' · ' + D.role);
    $('brandName').innerHTML = esc(D.brand) + '<small>@</small>';
    $('heroKicker').textContent = D.kicker;
    var lastName = D.lastName ? ' <em>' + esc(D.lastName) + '</em>' : '';
    $('heroName').innerHTML = esc(D.firstName) + lastName;
    $('heroSub').textContent = D.summary;

    $('aboutDesc').textContent = A.desc;
    $('aboutText').innerHTML = A.paragraphs.map(function(p){ return '<p>' + rich(p) + '</p>'; }).join('');
    /* 初始直接渲染最终值：IO 不可用或未触发时也不会停在 0；进入视口时再从 0 播放动画 */
    $('statsWrap').innerHTML = A.stats.map(function(s,i){
      var finalVal = esc(s.value) + esc(s.suffix||'');
      return '<div class="stat reveal"' + delay(i) + '><div class="stat-num"><span data-count="' + esc(s.value) + '" data-suffix="' + esc(s.suffix||'') + '">' + finalVal + '</span></div><span class="stat-label">' + esc(s.label) + '</span></div>';
    }).join('');

    $('skillsDesc').textContent = S.desc;
    $('skillsGrid').innerHTML = S.groups.map(function(g,gi){
      var things = g.items.map(function(t){ return '<span class="thing">' + esc(t) + '</span>'; }).join('');
      return '<div class="skill-card reveal"' + delay(gi) + '><h3>' + esc(g.name) + '</h3><div class="skill-things">' + things + '</div></div>';
    }).join('');

    $('contactDesc').textContent = C.desc;
    $('contactHeading').innerHTML = C.heading;
    $('contactIntro').textContent = C.intro;
    var mailLink = D.email ? '<a href="mailto:' + esc(D.email) + '">' + esc(D.email) + '</a>' : '<span class="mono">' + esc(D.emailDisplay||'邮箱待配置') + '</span>';
    $('contactEmail').innerHTML = '&rarr; ' + mailLink;
    var socials = '';
    C.socials.forEach(function(s){
      var url = s.url || (s.icon === 'mail' && D.email ? 'mailto:' + D.email : '');
      if (url) socials += outLink(url, s.label, url.indexOf('mailto:') !== 0);
      else socials += '<span class="social">' + esc(s.label) + '</span>';
    });
    $('socialsWrap').innerHTML = socials;

    var fy = (D.footerName || (D.firstName + ' ' + (D.lastName||''))).trim();
    $('footerWrap').innerHTML = '&copy; ' + new Date().getFullYear() + ' ' + esc(fy) + ' &middot; ' + esc(F.note);

    if (isDraft) {
      var badge = doc.createElement('div');
      badge.className = 'draft-badge';
      badge.textContent = '草稿预览中 · 尚未发布';
      doc.body.appendChild(badge);
    }
  }
  render();

  /* ---------- 主题 ---------- */
  var mode = 'auto';
  try { mode = localStorage.getItem('folio-theme-mode') || 'auto'; } catch(e){}
  var mqDark = window.matchMedia('(prefers-color-scheme: dark)');
  function applyTheme(m){
    var dark = m==='dark' || (m==='auto' && mqDark.matches);
    html.setAttribute('data-theme', dark?'dark':'light');
    html.setAttribute('data-mode', m);
  }
  applyTheme(mode);
  $('themeToggle').addEventListener('click', function(){
    mode = mode==='auto'?'light':mode==='light'?'dark':'auto';
    try{ localStorage.setItem('folio-theme-mode', mode); }catch(e){}
    applyTheme(mode);
  });
  if (mqDark.addEventListener) mqDark.addEventListener('change', function(){ if(mode==='auto') applyTheme('auto'); });
  else if (mqDark.addListener) mqDark.addListener(function(){ if(mode==='auto') applyTheme('auto'); });

  /* ---------- 进度条 + 回到顶部 ---------- */
  var progress = $('progressBar'), toTop = $('toTop');
  function onScroll(){
    var max = doc.documentElement.scrollHeight - window.innerHeight;
    var y = window.scrollY || doc.documentElement.scrollTop;
    progress.style.width = (max>0 ? (y/max)*100 : 0) + '%';
    toTop.classList.toggle('show', y>500);
  }
  window.addEventListener('scroll', onScroll, {passive:true});
  onScroll();
  toTop.addEventListener('click', function(){ window.scrollTo({top:0,behavior:reduceMotion?'auto':'smooth'}); });

  /* ---------- 移动菜单 ---------- */
  var nav = $('nav'), hamburger = $('hamburger');
  var navLinks = [].slice.call(doc.querySelectorAll('.nav-links a'));
  function closeMenu(){ nav.classList.remove('open'); hamburger.setAttribute('aria-expanded','false'); hamburger.setAttribute('aria-label','打开菜单'); }
  hamburger.addEventListener('click', function(){
    var open = nav.classList.toggle('open');
    hamburger.setAttribute('aria-expanded', open?'true':'false');
    hamburger.setAttribute('aria-label', open?'关闭菜单':'打开菜单');
  });
  navLinks.forEach(function(a){ a.addEventListener('click', closeMenu); });
  doc.addEventListener('keydown', function(e){ if(e.key==='Escape' && nav.classList.contains('open')){ closeMenu(); hamburger.focus(); } });

  /* ---------- scrollspy ---------- */
  var sections = [].slice.call(doc.querySelectorAll('main section[id]'));
  if ('IntersectionObserver' in window){
    var spy = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if (en.isIntersecting){
          var id = en.target.getAttribute('id');
          navLinks.forEach(function(a){ a.classList.toggle('active', a.getAttribute('href')==='#'+id); });
        }
      });
    }, {rootMargin:'-45% 0px -50% 0px'});
    sections.forEach(function(s){ spy.observe(s); });
  }

  /* ---------- 滚动入场 ---------- */
  var revealEls = [].slice.call(doc.querySelectorAll('.reveal'));
  if ('IntersectionObserver' in window && !reduceMotion){
    var ro = new IntersectionObserver(function(entries){
      entries.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add('visible'); ro.unobserve(en.target); } });
    }, {threshold:0.15});
    revealEls.forEach(function(el){ ro.observe(el); });
  } else {
    revealEls.forEach(function(el){ el.classList.add('visible'); });
  }

  /* ---------- 数字滚动 ---------- */
  var counters = [].slice.call(doc.querySelectorAll('[data-count]'));
  function animateCount(el){
    if (el.getAttribute('data-done')) return;
    el.setAttribute('data-done', '1');
    var target = parseFloat(el.getAttribute('data-count'));
    var suffix = el.getAttribute('data-suffix')||'';
    if (reduceMotion){ el.textContent = target + suffix; return; }
    var dur=1200, t0=null;
    function step(t){
      if(!t0) t0=t;
      var p=Math.min((t-t0)/dur,1), e=1-Math.pow(1-p,3);
      el.textContent = Math.round(target*e)+suffix;
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  if ('IntersectionObserver' in window){
    var co = new IntersectionObserver(function(entries){
      entries.forEach(function(en){ if(en.isIntersecting){ animateCount(en.target); co.unobserve(en.target); } });
    }, {threshold:0.2});
    counters.forEach(function(c){ co.observe(c); });
    /* 兜底：已在视口内却还没触发的计数器（如页面直接定位到中部）立即补上 */
    window.addEventListener('scroll', function(){
      counters.forEach(function(c){
        if (c.getAttribute('data-done')) return;
        var r = c.getBoundingClientRect();
        if (r.top < window.innerHeight && r.bottom > 0) animateCount(c);
      });
    }, {passive:true});
  } else counters.forEach(animateCount);

  /* ---------- 打字机 ---------- */
  var phrases = (D.typing && D.typing.length)?D.typing:['Hello World'];
  var typed = $('typed');
  if (reduceMotion || !typed){ if(typed) typed.textContent = phrases[0]; }
  else {
    var pi=0, ci=0, deleting=false;
    (function tick(){
      var cur = phrases[pi];
      ci += deleting?-1:1;
      typed.textContent = cur.slice(0,ci);
      var d2;
      if(!deleting && ci===cur.length){ d2=1500; deleting=true; }
      else if(deleting && ci===0){ deleting=false; pi=(pi+1)%phrases.length; d2=350; }
      else d2 = deleting?45:95;
      setTimeout(tick, d2);
    })();
  }

  /* ---------- 表单校验 ---------- */
  var form = $('contactForm');
  var validators = {
    name:{el:$('name'),test:function(v){return v.trim().length>=2;}},
    email:{el:$('email'),test:function(v){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());}},
    message:{el:$('message'),test:function(v){return v.trim().length>=5;}}
  };
  var toastEl = null;
  function toast(text){
    if(!toastEl){ toastEl=doc.createElement('div'); toastEl.className='toast'; toastEl.setAttribute('role','status'); doc.body.appendChild(toastEl); }
    toastEl.innerHTML = '<span class="tick">&check;</span>' + text;
    toastEl.classList.add('show');
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(function(){ toastEl.classList.remove('show'); }, 3000);
  }
  Object.keys(validators).forEach(function(key){
    var v = validators[key];
    v.el.addEventListener('input', function(){ if(v.test(v.el.value)) v.el.closest('.field').classList.remove('err'); });
  });
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var ok = true;
    Object.keys(validators).forEach(function(key){
      var v = validators[key];
      var pass = v.test(v.el.value);
      v.el.closest('.field').classList.toggle('err', !pass);
      if(!pass) ok=false;
    });
    if(ok){ toast('已收到你的消息（演示页面，未实际发送）'); form.reset(); }
    else toast('请检查表单中标红的字段');
  });
})();
</script>
</body>
</html>

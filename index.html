<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hang · @ibi6</title>
<meta name="description" content="Hang 的个人网站：项目、GitHub 动态和笔记。">
<script>try{var t=localStorage.getItem('hang-theme-v2');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<div class="progress" id="progress"></div>

<header class="nav" id="nav">
  <a class="brand" href="#home"><b>H</b><span>Hang</span></a>
  <nav class="links" id="links">
    <a href="#home" data-sec="home">首页</a>
    <a href="#projects" data-sec="projects">项目</a>
    <a href="#github" data-sec="github">GitHub</a>
    <a href="#notes" data-sec="notes">笔记</a>
    <a href="#contact" data-sec="contact">联系</a>
    <i class="pill" id="pill"></i>
  </nav>
  <button class="kbd-btn" id="openCmd" aria-label="打开命令面板"><span>搜索</span><kbd>Ctrl K</kbd></button>
  <button class="theme" id="theme" aria-label="切换明暗主题"><i></i></button>
</header>

<main id="top">
  <div id="homePage">
  <section class="hero" id="hero">
    <canvas id="city" aria-hidden="true"></canvas>
    <div class="hero-in">
      <p class="eyebrow"><i class="dot"></i><span id="typed"></span><b class="caret"></b></p>
      <h1 class="name" aria-label="Hang"><span>H</span><span>a</span><span>n</span><span>g</span></h1>
      <p class="lead rv">写界面，也写接口。<br>这里放我做过的项目、GitHub 上的动静，和一些笔记。</p>
      <div class="hero-cta rv">
        <a class="btn solid" href="#projects" data-mag>看项目 <i>→</i></a>
        <a class="btn" id="ghLink" href="https://github.com/ibi6" target="_blank" rel="noopener" data-mag>@ibi6</a>
      </div>
    </div>
    <p class="city-cap" id="cityCap"></p>
  </section>

  </div>
  <section class="sec" id="projects">
    <header class="sec-h"><span class="idx">01</span><h2 class="rv">项目</h2><p class="rv" id="projSub"></p></header>
    <div class="proj-wrap">
      <ol class="proj-list" id="projList"></ol>
      <aside class="proj-view" id="projView" aria-live="polite"></aside>
    </div>
  </section>

  <section class="sec" id="github">
    <header class="sec-h"><span class="idx">02</span><h2 class="rv">GitHub</h2><p class="rv" id="ghSub"></p></header>
    <div class="gh-stats" id="ghStats"></div>
    <div class="heat-card rv">
      <div class="heat-top"><b id="heatTitle"></b><span id="heatTip">把鼠标放到格子上</span></div>
      <div class="heat-scroll"><div class="heat" id="heat"></div></div>
      <div class="heat-legend"><span>少</span><i data-l="0"></i><i data-l="1"></i><i data-l="2"></i><i data-l="3"></i><i data-l="4"></i><span>多</span></div>
    </div>
    <div class="langs rv">
      <b>公开仓库里的语言占比</b>
      <div class="lang-bar" id="langBar"></div>
      <ul class="lang-key" id="langKey"></ul>
    </div>
  </section>

  <section class="sec" id="notes">
    <header class="sec-h"><span class="idx">03</span><h2 class="rv">笔记</h2><p class="rv">记录与思考 · 持续更新</p></header>
    <div class="tags" id="tags"></div>
    <div class="note-grid" id="noteGrid"></div>
  </section>
</main>

<footer class="foot" id="contact">
  <p class="eyebrow">04 · 联系</p>
  <a class="big-link" href="https://github.com/ibi6" target="_blank" rel="noopener"><span>github.com/ibi6</span><i>↗</i></a>
  <div class="foot-row"><span id="snap"></span><span id="clock"></span><a href="#home">回到首页 ↗</a></div>
</footer>

<div class="reader" id="reader" hidden>
  <div class="reader-bg" data-close></div>
  <article class="reader-box" role="dialog" aria-modal="true" aria-labelledby="rTitle">
    <button class="x" data-close aria-label="关闭">×</button>
    <div class="reader-bar" id="rBar"></div>
    <div class="reader-scroll" id="rScroll"><p class="r-meta" id="rMeta"></p><h2 id="rTitle"></h2><div class="md" id="rBody"></div></div>
  </article>
</div>

<div class="cmd" id="cmd" hidden>
  <div class="cmd-bg" data-close></div>
  <div class="cmd-box" role="dialog" aria-modal="true" aria-label="命令面板">
    <input id="cmdIn" type="text" placeholder="找项目、笔记，或者跳到某一节…" autocomplete="off" spellcheck="false">
    <ul id="cmdList"></ul>
    <p class="cmd-foot"><kbd>↑</kbd><kbd>↓</kbd> 选择 <kbd>Enter</kbd> 打开 <kbd>Esc</kbd> 关闭</p>
  </div>
</div>

<script src="data.js"></script>
<script src="notes/notes.js"></script>
<script src="js/site.js"></script>
<script src="js/enrich.js"></script>
<script src="js/write-note.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Hang · 独立开发者 · 开源与工具" />
  <title>Hang · 独立开发者</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" />
  <style>
    :root {
      --primary: #4051b5;
      --primary-light: #5d6cc0;
      --primary-dark: #303fa1;
      --accent: #526cfe;
      --bg: #ffffff;
      --bg-soft: #f5f5f7;
      --bg-footer: #ececf1;
      --fg: #1a1a1a;
      --fg-light: #5f6368;
      --fg-faint: #9aa0a6;
      --border: #e5e7eb;
      --border-soft: #eeeef2;
      --shadow: 0 1px 2px rgba(0,0,0,.04);
      --shadow-hover: 0 4px 12px rgba(0,0,0,.08);
      --radius: 12px;
      --header-h: 52px;
      --tabs-h: 42px;
      --sidebar-w: 220px;
      --content-max: 920px;
      --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: "JetBrains Mono", ui-monospace, monospace;
    }
    [data-theme="dark"] {
      --primary: #7b86d6;
      --primary-light: #9aa3e3;
      --primary-dark: #5d6cc0;
      --accent: #8b9bff;
      --bg: #1e2129;
      --bg-soft: #262a34;
      --bg-footer: #171a21;
      --fg: #e8eaed;
      --fg-light: #b0b6bf;
      --fg-faint: #7a8190;
      --border: #343a46;
      --border-soft: #2c313c;
      --shadow: 0 1px 2px rgba(0,0,0,.25);
      --shadow-hover: 0 6px 18px rgba(0,0,0,.35);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--fg);
      background: var(--bg);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    img { max-width: 100%; display: block; }
    code, .mono { font-family: var(--mono); }

    /* ===== Header ===== */
    .site-header {
      position: sticky; top: 0; z-index: 100;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: saturate(180%) blur(10px);
      border-bottom: 1px solid var(--border-soft);
    }
    .header-inner {
      max-width: 1280px; margin: 0 auto;
      height: var(--header-h);
      padding: 0 1.25rem;
      display: flex; align-items: center; gap: 1rem;
    }
    .brand {
      display: inline-flex; align-items: center; gap: .55rem;
      color: var(--fg); text-decoration: none !important;
      font-weight: 300; letter-spacing: .08em; font-size: .95rem;
    }
    .brand-mark {
      width: 28px; height: 28px; border-radius: 8px;
      background: linear-gradient(135deg, var(--primary), #764ba2);
      color: #fff; display: grid; place-items: center;
      font-weight: 700; font-size: .8rem; letter-spacing: 0;
    }
    .header-spacer { flex: 1; }
    .header-actions { display: flex; align-items: center; gap: .35rem; }
    .icon-btn {
      width: 36px; height: 36px; border: 0; border-radius: 8px;
      background: transparent; color: var(--fg-light); cursor: pointer;
      display: grid; place-items: center;
    }
    .icon-btn:hover { background: var(--bg-soft); color: var(--fg); }
    .icon-btn svg { width: 20px; height: 20px; }
    .gh-source {
      display: inline-flex; align-items: center; gap: .45rem;
      padding: .35rem .6rem; border-radius: 8px;
      color: var(--fg) !important; text-decoration: none !important;
      font-size: .8rem;
    }
    .gh-source:hover { background: var(--bg-soft); }
    .gh-source svg { width: 16px; height: 16px; }
    .menu-toggle { display: none; }

    /* ===== Tabs ===== */
    .tabs-bar {
      border-bottom: 1px solid var(--border-soft);
      background: var(--bg);
    }
    .tabs-inner {
      max-width: 1280px; margin: 0 auto;
      padding: 0 1.25rem;
      height: var(--tabs-h);
      display: flex; align-items: stretch; gap: .25rem;
      overflow-x: auto; scrollbar-width: none;
    }
    .tabs-inner::-webkit-scrollbar { display: none; }
    .tabs-inner a {
      display: inline-flex; align-items: center;
      padding: 0 .85rem; color: var(--fg-light);
      font-size: .86rem; font-weight: 500;
      text-decoration: none !important;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
    }
    .tabs-inner a:hover { color: var(--fg); }
    .tabs-inner a.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    /* ===== Shell ===== */
    .shell {
      max-width: 1280px; margin: 0 auto;
      display: grid;
      grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
      gap: 0;
      min-height: calc(100vh - var(--header-h) - var(--tabs-h));
    }
    .sidebar {
      position: sticky;
      top: calc(var(--header-h) + var(--tabs-h));
      align-self: start;
      height: calc(100vh - var(--header-h) - var(--tabs-h));
      overflow: auto;
      padding: 1.25rem 0.75rem 2rem 1.25rem;
      border-right: 1px solid var(--border-soft);
      font-size: .86rem;
    }
    .sidebar h4 {
      margin: 1rem 0 .4rem; font-size: .72rem; font-weight: 700;
      letter-spacing: .06em; text-transform: uppercase; color: var(--fg-faint);
    }
    .sidebar h4:first-child { margin-top: 0; }
    .sidebar a {
      display: block; padding: .35rem .6rem; border-radius: 6px;
      color: var(--fg-light); text-decoration: none !important;
    }
    .sidebar a:hover, .sidebar a.active {
      background: color-mix(in srgb, var(--primary) 10%, transparent);
      color: var(--primary);
    }

    .main {
      padding: 1.25rem 1.5rem 3rem;
    }
    .home {
      max-width: var(--content-max);
      margin: 0 auto;
    }

    /* ===== Hero ===== */
    .hero-wrapper {
      display: flex; align-items: center; justify-content: space-between;
      gap: 1.5rem;
      padding: 2.1rem 2.4rem;
      margin: .35rem 0 1rem;
      border-radius: 16px;
      background-image: radial-gradient(var(--border) 1.2px, transparent 1.2px);
      background-size: 18px 18px;
      background-color: var(--bg);
    }
    .hero-content { flex: 1; min-width: 0; }
    .hero-title {
      font-size: 2.05rem; font-weight: 800; margin: 0;
      line-height: 1.3; color: var(--fg);
    }
    .marker {
      background: linear-gradient(to bottom, transparent 60%, rgba(100,108,255,.25) 0%);
      padding: 0 6px; border-radius: 4px; color: var(--primary);
    }
    .hero-intro {
      font-size: 1.55rem; font-weight: 500; margin: .55rem 0 1rem;
      color: var(--fg-light); line-height: 1.35;
    }
    .typewriter-row {
      height: 1.75rem; margin: .85rem 0 1.1rem;
      display: flex; align-items: center;
      font-family: var(--mono); font-size: 1.15rem; font-weight: 700;
      color: var(--fg-light);
    }
    .cursor {
      display: inline-block; width: 3px; height: 1.25rem;
      margin-left: 5px; background: var(--primary);
      animation: blink .8s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .hero-btns { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: .4rem; }
    .btn {
      display: inline-flex; align-items: center; gap: .55rem;
      padding: .42rem 1rem; border-radius: 8px;
      font-size: .9rem; font-weight: 500; line-height: 1.2;
      text-decoration: none !important; transition: transform .2s, box-shadow .2s;
      border: 0; cursor: pointer;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,.1); text-decoration: none !important; }
    .btn svg { width: 1.05rem; height: 1.05rem; fill: currentColor; }
    .btn-primary { background: var(--primary); color: #fff !important; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: var(--bg-soft); color: var(--fg) !important; }
    .avatar-glow {
      width: 10.8rem; height: 10.8rem; border-radius: 50%;
      padding: 4px; flex-shrink: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      box-shadow: 0 10px 30px rgba(118, 75, 162, .35);
    }
    .avatar-inner {
      width: 100%; height: 100%; border-radius: 50%;
      background: var(--bg);
      display: grid; place-items: center;
      font-size: 3.2rem; font-weight: 700; color: var(--primary);
      letter-spacing: -.02em;
    }

    /* ===== Category tiles ===== */
    .grid-container {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 10px; margin: 1.1rem 0 1.4rem;
    }
    .grid-card {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius); padding: .9rem 1rem;
      box-shadow: var(--shadow);
      display: flex; flex-direction: column; gap: .35rem;
      transition: border-color .25s, box-shadow .25s, transform .25s;
      text-decoration: none !important; color: inherit;
    }
    .grid-card:hover {
      border-color: var(--primary);
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
      text-decoration: none !important;
    }
    .grid-card h3 {
      margin: 0; font-size: 1rem; font-weight: 700;
      display: flex; align-items: center; gap: .4rem; color: var(--fg);
    }
    .grid-card h3 .ico { font-size: 1.05rem; }
    .grid-card p {
      margin: 0; font-size: .82rem; line-height: 1.5; color: var(--fg-light);
    }
    .tag-box {
      display: flex; flex-wrap: wrap; gap: .55rem; margin-top: .35rem;
      align-items: center; font-size: .72rem;
    }
    .tag-link {
      display: inline-flex; align-items: center; gap: 2px;
      color: var(--primary) !important; font-weight: 700;
      text-decoration: none !important;
    }
    .tag-link:hover { opacity: .85; }
    .tag-link .jump {
      width: 13px; height: 13px; fill: currentColor;
      transition: transform .3s cubic-bezier(.34,1.56,.64,1);
    }
    .tag-link:hover .jump { transform: translate(3px,-3px); }
    .tag-hash {
      color: var(--fg-light); opacity: .8; font-weight: 400;
    }
    .tag-hash::before { content: "#"; opacity: .55; font-family: var(--mono); margin-right: 1px; }

    /* ===== Sections ===== */
    .section { margin: 2.4rem 0 0; }
    .section-head {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 1rem; margin-bottom: .85rem;
    }
    .section-head h2 {
      margin: 0; font-size: 1.25rem; font-weight: 700; color: var(--fg);
    }
    .section-desc { margin: 0 0 1rem; color: var(--fg-light); font-size: .92rem; }
    .rec-title {
      margin: 2rem 0 1.25rem; font-weight: 700; color: var(--fg);
      display: flex; align-items: center; justify-content: center; gap: 14px;
      font-size: 1.05rem;
    }
    .rec-title::before, .rec-title::after {
      content: ""; height: 1px; flex: 1; max-width: 200px; opacity: .55;
      background: linear-gradient(90deg, transparent, var(--fg-faint));
    }
    .rec-title::after { background: linear-gradient(90deg, var(--fg-faint), transparent); }
    .rec-title .book { color: var(--primary); }

    .about-text p { margin: 0 0 .85rem; color: var(--fg-light); font-size: .95rem; }
    .about-text strong { color: var(--fg); font-weight: 600; }
    .stats {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: .75rem;
      margin-top: 1.1rem;
    }
    .stat {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius); padding: .9rem 1rem; text-align: center;
      box-shadow: var(--shadow);
    }
    .stat .val { font-size: 1.55rem; font-weight: 800; color: var(--primary); }
    .stat .lbl { font-size: .78rem; color: var(--fg-light); margin-top: .15rem; }

    .skills-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
    }
    .skill-card {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius); padding: .85rem 1rem;
      box-shadow: var(--shadow);
      transition: border-color .25s, transform .25s, box-shadow .25s;
    }
    .skill-card:hover {
      border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-hover);
    }
    .skill-card h3 { margin: 0 0 .55rem; font-size: .95rem; }
    .things { display: flex; flex-wrap: wrap; gap: .4rem; }
    .thing {
      font-size: .75rem; padding: .2rem .5rem; border-radius: 999px;
      background: var(--bg-soft); color: var(--fg-light); border: 1px solid var(--border-soft);
    }

    .projects-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
    }
    .project-card {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1rem 1.05rem;
      box-shadow: var(--shadow);
      display: flex; flex-direction: column; gap: .45rem;
      transition: border-color .25s, transform .25s, box-shadow .25s;
      text-decoration: none !important; color: inherit;
      min-height: 132px;
    }
    .project-card:hover {
      border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-hover);
      text-decoration: none !important;
    }
    .project-top { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
    .project-card h3 { margin: 0; font-size: .98rem; font-weight: 700; color: var(--fg); }
    .badge {
      font-size: .68rem; font-weight: 600; padding: .15rem .45rem; border-radius: 999px;
      border: 1px solid var(--border);
    }
    .badge.public { color: #137333; background: #e6f4ea; border-color: #ceead6; }
    .badge.private { color: var(--fg-light); background: var(--bg-soft); }
    [data-theme="dark"] .badge.public { color: #81c995; background: #16351f; border-color: #274e32; }
    .project-card p { margin: 0; font-size: .82rem; color: var(--fg-light); flex: 1; }
    .project-links { display: flex; gap: .75rem; font-size: .78rem; font-weight: 600; }
    .project-links a { color: var(--primary); text-decoration: none !important; }
    .project-links a:hover { text-decoration: underline !important; }

    .rec-list {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
    }
    .rec-item {
      display: block; background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius); padding: .85rem 1rem;
      box-shadow: var(--shadow);
      transition: border-color .25s, transform .25s, box-shadow .25s;
      text-decoration: none !important; color: inherit;
    }
    .rec-item:hover {
      border-color: var(--primary); transform: translateY(-2px); box-shadow: var(--shadow-hover);
      text-decoration: none !important;
    }
    .rec-item h3 { margin: 0 0 .25rem; font-size: .95rem; color: var(--primary); font-weight: 700; }
    .rec-item p { margin: 0; font-size: .8rem; color: var(--fg-light); }
    .rec-item .tags { margin-top: .45rem; display: flex; flex-wrap: wrap; gap: .4rem; }
    .rec-note { margin: .75rem 0 0; font-size: .8rem; color: var(--fg-faint); }

    .contact-box {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 16px; padding: 1.4rem 1.5rem; box-shadow: var(--shadow);
    }
    .contact-box h2 { margin: 0 0 .5rem; font-size: 1.35rem; }
    .contact-box p { margin: 0 0 1rem; color: var(--fg-light); }
    .socials { display: flex; flex-wrap: wrap; gap: .6rem; }
    .social {
      display: inline-flex; align-items: center; gap: .45rem;
      padding: .45rem .9rem; border-radius: 8px;
      background: var(--bg-soft); color: var(--fg) !important;
      text-decoration: none !important; font-size: .88rem; font-weight: 500;
      border: 1px solid var(--border-soft);
    }
    .social:hover { border-color: var(--primary); color: var(--primary) !important; }
    .social svg { width: 16px; height: 16px; fill: currentColor; }

    .reveal { opacity: 0; transform: translateY(10px); transition: opacity .45s ease, transform .45s ease; }
    .reveal.in { opacity: 1; transform: none; }

    .site-footer {
      background: var(--bg-footer); color: var(--fg-light);
      border-top: 1px solid var(--border-soft);
      padding: 1.4rem 1.25rem; text-align: center; font-size: .82rem;
    }

    .drawer-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 120;
    }
    .drawer-overlay.open { display: block; }

    @media (max-width: 960px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar {
        position: fixed; left: 0; top: 0; bottom: 0; z-index: 130;
        width: min(280px, 86vw); height: 100vh; background: var(--bg);
        transform: translateX(-105%); transition: transform .25s ease;
        border-right: 1px solid var(--border);
        padding-top: 1rem;
      }
      .sidebar.open { transform: none; }
      .menu-toggle { display: grid; }
      .gh-source span.repo { display: none; }
      .hero-wrapper {
        flex-direction: column-reverse; text-align: center;
        padding: 1.25rem .9rem; gap: 1.2rem;
      }
      .hero-content { text-align: center; }
      .typewriter-row, .hero-btns { justify-content: center; }
      .avatar-glow { width: 7.5rem; height: 7.5rem; margin: 0 auto; }
      .avatar-inner { font-size: 2.4rem; }
      .hero-title { font-size: 1.65rem; }
      .hero-intro { font-size: 1.25rem; }
      .grid-container, .projects-grid, .rec-list, .skills-grid { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <button class="icon-btn menu-toggle" id="menuBtn" aria-label="打开导航" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M4 12h16M4 19h16"/></svg>
      </button>
      <a class="brand" href="#top">

        <span id="brandName">ibi6</span>

          <svg id="themeIconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>

          <span class="repo">ibi6</span>
        </a>
      </div>
    </div>
  </header>

  <nav class="tabs-bar" aria-label="主导航">
    <div class="tabs-inner" id="navLinks">
      <a href="#top" class="active" data-tab>首页</a>
      <a href="#about" data-tab>关于</a>
      <a href="#skills" data-tab>能力</a>
      <a href="#projects" data-tab>项目</a>
      <a href="#recommends" data-tab>推荐</a>
      <a href="#contact" data-tab>联系</a>
    </div>
  </nav>

  <div class="drawer-overlay" id="drawerOverlay"></div>

  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="侧栏导航">
      <h4>本站</h4>
      <a href="#top" data-side>欢迎</a>
      <a href="#categories" data-side>分类</a>
      <a href="#about" data-side>关于</a>
      <h4>作品</h4>
      <a href="#skills" data-side>技术能力</a>
      <a href="#projects" data-side>我的项目</a>
      <a href="#recommends" data-side>推荐阅读</a>

      <a href="#contact" data-side>聊聊</a>
      <a href="https://github.com/ibi6" target="_blank" rel="noopener">GitHub ↗</a>
    </aside>

    <main class="main">
      <div class="home">
        <section id="top" class="reveal">
          <div class="hero-wrapper">
            <div class="hero-content">
              <p class="hero-title">Hi, I'm <span class="marker" id="heroName">Hang</span>.</p>
              <p class="hero-intro" id="heroWelcome">Welcome to my hub! 👋</p>
              <div class="typewriter-row">
                <span id="typewriter"></span><span class="cursor" aria-hidden="true"></span>
              </div>
              <p id="heroSub" style="margin:0 0 1rem;color:var(--fg-light);font-size:.95rem;"></p>
              <div class="hero-btns" id="heroBtns"></div>
            </div>
            <div class="avatar-glow" aria-hidden="true">
              <div class="avatar-inner" id="avatarLetter">H</div>
            </div>
          </div>
        </section>

        <section id="categories" class="reveal">
          <div class="grid-container" id="hubGrid"></div>
        </section>

        <section id="about" class="section reveal">
          <div class="section-head"><h2>关于我</h2></div>
          <p class="section-desc" id="aboutDesc"></p>
          <div class="about-text" id="aboutText"></div>
          <div class="stats" id="statsWrap"></div>
        </section>

        <section id="skills" class="section reveal">
          <div class="section-head"><h2>技术能力</h2></div>
          <p class="section-desc" id="skillsDesc"></p>
          <div class="skills-grid" id="skillsGrid"></div>
        </section>

        <section id="projects" class="section reveal">
          <div class="section-head"><h2>我的项目</h2></div>
          <p class="section-desc" id="projectsDesc"></p>
          <div class="projects-grid" id="projectsGrid"></div>
        </section>

        <h3 class="rec-title reveal"><span class="book" aria-hidden="true">📖</span> 推荐阅读</h3>

        <section id="recommends" class="section reveal" style="margin-top:0">
          <p class="section-desc" id="recommendsDesc"></p>
          <div class="rec-list" id="recommendsList"></div>
          <p class="rec-note" id="recommendsNote"></p>
        </section>

        <section id="contact" class="section reveal">
          <div class="contact-box">
            <h2 id="contactHeading">聊聊技术</h2>
            <p id="contactIntro"></p>
            <div class="socials" id="socialsWrap"></div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <footer class="site-footer" id="footerWrap"></footer>

  <script src="./content.js"></script>
  <script>
  (function () {
    const D = window.PORTFOLIO_DATA;
    if (!D) return;

    const $ = (id) => document.getElementById(id);
    const md = (s) => String(s || '').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    const esc = (s) => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    const icons = {
      github: '<svg viewBox="0 0 24 24"><path d="M12 .5C5.73.5.5 5.74.5 12.02c0 5.1 3.29 9.42 7.86 10.95.58.11.79-.25.79-.56v-2.02c-3.2.7-3.87-1.54-3.87-1.54-.53-1.36-1.3-1.72-1.3-1.72-1.06-.73.08-.72.08-.72 1.17.08 1.79 1.2 1.79 1.2 1.04 1.8 2.73 1.28 3.4.98.1-.76.41-1.28.74-1.57-2.6-.3-5.34-1.31-5.34-5.83 0-1.29.46-2.34 1.21-3.17-.12-.3-.52-1.52.11-3.17 0 0 .99-.32 3.24 1.21a11.2 11.2 0 0 1 5.9 0c2.25-1.53 3.23-1.21 3.23-1.21.64 1.65.24 2.87.12 3.17.76.83 1.21 1.88 1.21 3.17 0 4.53-2.75 5.53-5.37 5.82.42.37.8 1.1.8 2.22v3.29c0 .31.21.68.8.56A10.53 10.53 0 0 0 23.5 12C23.5 5.74 18.27.5 12 .5z"/></svg>',
      link: '<svg viewBox="0 0 24 24"><path d="M3.9 12a5 5 0 0 1 5-5h4v2h-4a3 3 0 1 0 0 6h4v2h-4a5 5 0 0 1-5-5m7-1h6v2h-6zm4.1-4h4a5 5 0 0 1 0 10h-4v-2h4a3 3 0 1 0 0-6h-4z"/></svg>'
    };
    const jumpIcon = '<svg class="jump" viewBox="0 0 24 24"><path d="M5 17.59L15.59 7H9V5h10v10h-2V8.41L6.41 19 5 17.59z"/></svg>';

    /* theme */
    const root = document.documentElement;
    function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    const saved = lsGet('ibi6-theme');
    const preferDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    function applyTheme(mode) {
      root.setAttribute('data-theme', mode);
      lsSet('ibi6-theme', mode);
      const dark = mode === 'dark';
      $('themeIconSun').hidden = dark;
      $('themeIconMoon').hidden = !dark;
    }
    applyTheme(saved || (preferDark ? 'dark' : 'light'));
    $('themeBtn').addEventListener('click', () => {
      applyTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });

    /* drawer */
    const sidebar = $('sidebar');
    const overlay = $('drawerOverlay');
    function closeDrawer() { sidebar.classList.remove('open'); overlay.classList.remove('open'); }
    $('menuBtn').addEventListener('click', () => {
      sidebar.classList.toggle('open'); overlay.classList.toggle('open');
    });
    overlay.addEventListener('click', closeDrawer);
    sidebar.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
      if (window.matchMedia('(max-width: 960px)').matches) closeDrawer();
    }));

    /* fill profile */
    const p = D.profile;
    document.title = p.siteTitle || 'Hang';
    $('brandName').textContent = p.brand || 'ibi6';
    $('heroName').textContent = [p.firstName, p.lastName].filter(Boolean).join(' ') || 'Hang';
    $('avatarLetter').textContent = (p.firstName || 'H').charAt(0).toUpperCase();
    $('heroWelcome').textContent = p.welcome || 'Welcome to my hub! 👋';
    $('heroSub').textContent = p.motto || p.summary || '';
    $('headerGithub').href = p.github || 'https://github.com/ibi6';

    const btns = [];
    btns.push(`<a class="btn btn-primary" href="${esc(p.github || 'https://github.com/ibi6')}" target="_blank" rel="noopener">${icons.github} GitHub</a>`);
    btns.push(`<a class="btn btn-secondary" href="#projects">浏览项目</a>`);
    $('heroBtns').innerHTML = btns.join('');

    /* typewriter */
    const phrases = (p.typing && p.typing.length) ? p.typing : ['开源作品'];
    let pi = 0, ci = 0, deleting = false;
    const tw = $('typewriter');
    function tick() {
      const cur = phrases[pi];
      if (!deleting) {
        ci++;
        tw.textContent = cur.slice(0, ci);
        if (ci === cur.length) { deleting = true; setTimeout(tick, 1400); return; }
        setTimeout(tick, 70);
      } else {
        ci--;
        tw.textContent = cur.slice(0, ci);
        if (ci === 0) { deleting = false; pi = (pi + 1) % phrases.length; setTimeout(tick, 320); return; }
        setTimeout(tick, 38);
      }
    }
    tick();

    /* hub categories */
    $('hubGrid').innerHTML = (D.hubCategories || []).map(c => `
      <a class="grid-card" href="${esc(c.href)}">
        <h3><span class="ico">${c.icon || ''}</span> ${esc(c.title)}</h3>
        <p>${esc(c.desc)}</p>
        <div class="tag-box">
          <span class="tag-link">${esc(c.linkLabel || '进入')}${jumpIcon}</span>
          ${(c.tags || []).map(t => `<span class="tag-hash">${esc(t)}</span>`).join('')}
        </div>
      </a>
    `).join('');

    /* about */
    $('aboutDesc').textContent = D.about.desc || '';
    $('aboutText').innerHTML = (D.about.paragraphs || []).map(x => `<p>${md(x)}</p>`).join('');
    $('statsWrap').innerHTML = (D.about.stats || []).map(s => `
      <div class="stat">
        <div class="val"><span data-count="${s.value}">0</span>${esc(s.suffix || '')}</div>
        <div class="lbl">${esc(s.label)}</div>
      </div>
    `).join('');

    /* skills */
    $('skillsDesc').textContent = D.skills.desc || '';
    $('skillsGrid').innerHTML = (D.skills.groups || []).map(g => `
      <div class="skill-card">
        <h3>${esc(g.name)}</h3>
        <div class="things">${(g.items || []).map(i => `<span class="thing">${esc(i)}</span>`).join('')}</div>
      </div>
    `).join('');

    /* projects */
    $('projectsDesc').textContent = D.projects.desc || '';
    $('projectsGrid').innerHTML = (D.projects.items || []).map(item => {
      const vis = (item.visibility || 'public').toLowerCase();
      const links = [];
      if (item.github) links.push(`<a href="${esc(item.github)}" target="_blank" rel="noopener">GitHub</a>`);
      if (item.homepage) links.push(`<a href="${esc(item.homepage)}" target="_blank" rel="noopener">主页</a>`);
      return `
        <article class="project-card">
          <div class="project-top">
            <h3>${esc(item.name)}</h3>
            <span class="badge ${vis}">${vis === 'public' ? 'Public' : 'Private'}</span>
          </div>
          <p>${esc(item.tagline)}</p>
          <div class="things">${(item.tags || []).map(t => `<span class="thing">${esc(t)}</span>`).join('')}</div>
          <div class="project-links">${links.join('')}</div>
        </article>`;
    }).join('');

    /* recommends */
    $('recommendsDesc').textContent = D.recommends.desc || '';
    $('recommendsList').innerHTML = (D.recommends.items || []).map(r => `
      <a class="rec-item" href="${esc(r.url)}" target="_blank" rel="noopener">
        <h3>${esc(r.name)}</h3>
        <p>${esc(r.tagline)}</p>
        <div class="tags">${(r.tags || []).map(t => `<span class="tag-hash">${esc(t)}</span>`).join('')}</div>
      </a>
    `).join('');
    if (D.recommends.note) {
      const note = D.recommends.noteUrl
        ? `${esc(D.recommends.note)} · <a href="${esc(D.recommends.noteUrl)}" target="_blank" rel="noopener">open-source-treasure</a>`
        : esc(D.recommends.note);
      $('recommendsNote').innerHTML = note;
    }

    /* contact */
    $('contactHeading').textContent = (D.contact.heading || '').replace(/<[^>]+>/g, '');
    $('contactIntro').textContent = D.contact.intro || D.contact.desc || '';
    $('socialsWrap').innerHTML = (D.contact.socials || []).map(s => `
      <a class="social" href="${esc(s.url)}" target="_blank" rel="noopener">
        ${icons[s.icon] || icons.link} ${esc(s.label)}
      </a>
    `).join('');

    /* footer */
    const year = new Date().getFullYear();
    $('footerWrap').innerHTML = `© ${year} ${esc(p.footerName || p.firstName || 'Hang')} · ${esc((D.footer && D.footer.note) || '')}`;

    /* count-up */
    function animateCount(el) {
      const target = Number(el.getAttribute('data-count') || 0);
      const start = performance.now();
      const dur = 900;
      function frame(t) {
        const k = Math.min(1, (t - start) / dur);
        const eased = 1 - Math.pow(1 - k, 3);
        el.textContent = String(Math.round(target * eased));
        if (k < 1) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    /* reveal + active nav */
    const sections = ['top','about','skills','projects','recommends','contact'];
    const io = new IntersectionObserver((entries) => {
      entries.forEach(en => {
        if (en.isIntersecting) {
          en.target.classList.add('in');
          en.target.querySelectorAll('[data-count]').forEach(el => {
            if (!el.dataset.done) { el.dataset.done = '1'; animateCount(el); }
          });
        }
      });
    }, { threshold: 0.12 });
    document.querySelectorAll('.reveal').forEach(el => io.observe(el));

    const tabLinks = Array.from(document.querySelectorAll('#navLinks [data-tab]'));
    const sideLinks = Array.from(document.querySelectorAll('#sidebar [data-side]'));
    function setActive(id) {
      tabLinks.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + id));
      sideLinks.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + id));
    }
    const spy = new IntersectionObserver((entries) => {
      const visible = entries.filter(e => e.isIntersecting).sort((a,b) => b.intersectionRatio - a.intersectionRatio)[0];
      if (visible) setActive(visible.target.id);
    }, { rootMargin: '-35% 0px -50% 0px', threshold: [0.1, 0.3, 0.6] });
    sections.forEach(id => { const el = document.getElementById(id); if (el) spy.observe(el); });
  })();
  </script>
</body>
</html>
